<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OHS console</title>
    <link rel="stylesheet" href="/inbox/inbox.css" />
  </head>
  <body>
    <header>
      <h1>OHS console</h1>
      <span id="who"></span>
      <button id="signout" type="button" hidden>Sign out</button>
    </header>
    <nav id="nav" aria-label="Sections" hidden></nav>
    <main>
      <p id="status" role="status"></p>
      <div id="login" hidden>
        <button id="signin" type="button">Sign in</button>
      </div>
      <section id="profile" aria-label="Profile" hidden></section>
      <section id="approvals" aria-label="Approvals" hidden>
        <ul id="list" aria-live="polite"></ul>
      </section>
      <section id="devices" aria-label="Devices" hidden>
        <p class="note">
          Registered devices of every account. Revoking one is permanent: it
          blocks that device from creating or claiming approvals only when this
          server enforces device binding (CGA_DEVICE_BINDING_ENFORCED);
          execution leases already issued can still report their result.
        </p>
        <div class="toolbar">
          <button id="devices-refresh" type="button">Refresh</button>
        </div>
        <ul id="devices-list" aria-live="polite"></ul>
        <button id="devices-more" type="button" hidden>Load more</button>
      </section>
    </main>
    <script type="module" src="/inbox/inbox.js"></script>
  </body>
</html>
